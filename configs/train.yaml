# Phase 5 — QLoRA fine-tuning starting config (PROJECT_SPEC.md §5).
# Starting point, not gospel. Confirm the exact checkpoint id and rescale
# these values to the real model size + GPU from OPEN_DECISIONS #1/#4 at
# build time — do not assume.
model_name: null

quantization:
  load_in_4bit: true
  bnb_4bit_quant_type: nf4
  bnb_4bit_use_double_quant: true
  bnb_4bit_compute_dtype: bfloat16 # fall back to float16 + skip FlashAttention-2 on Turing GPUs

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

max_seq_len: 4096
per_device_batch_size: 1
gradient_accumulation_steps: 16
gradient_checkpointing: true
optim: paged_adamw_8bit
learning_rate: 2.0e-4
lr_scheduler_type: cosine
warmup_ratio: 0.03
num_train_epochs: 2
packing: true
seed: 42

# Logging + checkpointing cadence, in optimizer steps (1 step =
# per_device_batch_size * gradient_accumulation_steps examples).
logging_steps: 50
save_steps: 50
save_total_limit: 3 # keep the 3 newest checkpoints; older ones are pruned

# If OOM: reduce max_seq_len first. Sequence length is usually the binding
# constraint on a VRAM-limited card, not parameter count or LoRA rank.
