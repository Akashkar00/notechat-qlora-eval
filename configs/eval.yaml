# Phase 2 — eval harness config (PROJECT_SPEC.md §5)
bootstrap:
  n_resamples: 1000
  confidence_level: 0.95

calibration:
  n_bins: 15

# Fill in if the output is structured (schema.py / grounding.py apply).
# Leave null and delete the corresponding eval module if not applicable.
schema:
  enabled: false
  codes_field: null
  code_field: null
  evidence_field: null

# Size of the held-out set used for the Phase 2 acceptance run — shrink if
# the real dataset (docs/data_report.md) turns out smaller than this.
val_records: 200
