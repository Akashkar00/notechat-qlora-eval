name: tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      # Base dependency group only — deliberately NOT `--extra gpu`. The
      # metric modules import torch/bert-score lazily inside functions, so
      # the whole unit-test suite runs on CPU with no CUDA stack. If this
      # step ever needs the gpu extra, a module-level import has crept in
      # somewhere it shouldn't be.
      - name: Install dependencies
        run: uv sync --group dev

      - name: Run tests
        # Tests touching data/processed/*.parquet skip automatically when the
        # (gitignored) dataset is absent, which is always the case in CI.
        run: uv run pytest tests/ -v
